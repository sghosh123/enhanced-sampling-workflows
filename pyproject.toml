[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-sampling-workflows"
version = "0.1.0a2"
description = "Reusable, testable utilities for OpenMM metadynamics, umbrella-window preparation, and free-energy-surface diagnostics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
trajectory = ["MDAnalysis>=2.6"]
plot = ["matplotlib>=3.7"]
openmm = ["openmm>=8.0"]
dev = ["pytest>=8.0", "build>=1.2"]
all = ["MDAnalysis>=2.6", "matplotlib>=3.7", "openmm>=8.0"]

[project.scripts]
esw = "enhanced_sampling_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
